<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>2-4" スピーカー 3Dビューワー (サブバッフルねじ穴・完全露出初期表示仕様)</title>
  <style>
    body { margin: 0; padding: 0; overflow: hidden; background: #121316; font-family: 'Segoe UI', Meiryo, sans-serif; color: #eee; }
    #canvas-container { width: 100vw; height: 100vh; display: block; }
    #ui-panel {
      position: absolute; top: 20px; left: 20px; background: rgba(18, 20, 26, 0.95);
      backdrop-filter: blur(12px); padding: 18px 22px; border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.12); box-shadow: 0 12px 36px rgba(0,0,0,0.6);
      max-width: 340px; z-index: 10;
    }
    h2 { margin: 0 0 8px 0; font-size: 16px; color: #4fa3e3; }
    p { margin: 0 0 12px 0; font-size: 12px; color: #aaa; line-height: 1.4; }
    .control-group { margin-bottom: 12px; }
    label { display: block; font-size: 12px; margin-bottom: 5px; font-weight: 600; }
    select, button, input[type=range] {
      width: 100%; box-sizing: border-box; background: #262933; color: #fff;
      border: 1px solid #444; border-radius: 6px; padding: 7px 10px; font-size: 12px;
      cursor: pointer; transition: all 0.2s;
    }
    select:hover, button:hover { background: #323644; border-color: #4fa3e3; }
    .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    .status-badge {
      display: inline-block; padding: 8px 12px; border-radius: 6px; font-size: 11px;
      background: rgba(234, 179, 8, 0.25); color: #fde047; margin-top: 5px; font-weight: bold;
      border: 1px solid rgba(234, 179, 8, 0.4); line-height: 1.4;
    }
    #legend {
      position: absolute; bottom: 20px; left: 20px; background: rgba(18, 20, 26, 0.90);
      padding: 10px 16px; border-radius: 8px; font-size: 11px; display: flex; gap: 14px;
      border: 1px solid rgba(255,255,255,0.08); z-index: 10; flex-wrap: wrap; max-width: 80vw;
    }
    .legend-item { display: flex; align-items: center; gap: 6px; }
    .color-dot { width: 12px; height: 12px; border-radius: 3px; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="ui-panel">
    <h2>🔊 スピーカー 3D設計ビューワー</h2>
    
    <div class="control-group" style="background:rgba(79,163,227,0.15); padding:8px 10px; border-radius:8px; border:1px solid #4fa3e3;">
      <label style="color:#4fa3e3; margin-bottom:4px;">📦 エンクロージャーモデル選択</label>
      <select id="model-select" onchange="switchEnclosureModel()" style="border-color:#4fa3e3; font-weight:bold;">
        <option value="5.5L" selected>【新提案】5.5L 本格ダブルバスレフ (H310×D210mm / 50Hz)</option>
        <option value="3.2L">【現行】3.2L コンパクト机上型 (H230×D190mm / 68Hz)</option>
      </select>
    </div>

    <div class="control-group">
      <label style="color:#fde047;">✨ 分解表示 (バッフルを外してねじ穴を確認)</label>
      <input type="range" id="explode-slider" min="0" max="100" value="45" oninput="updateExplode(this.value)">
    </div>

    <div class="control-group">
      <button id="toggle-baffles-btn" onclick="toggleBaffles()" style="background:#3b82f6; font-weight:bold;">
        👁️ 前面・背面バッフル表示: ON (クリックで非表示)
      </button>
    </div>

    <div class="btn-group">
      <button id="cutaway-btn" onclick="toggleCutaway()" style="background:#10b981; font-weight:bold;">✂️ 右側板 断面表示: ON</button>
      <button onclick="toggleWireframe()">🕸️ ワイヤーフレーム</button>
    </div>
    <div class="btn-group">
      <button onclick="setFrontRightView()">📐 正面・右側面 (標準)</button>
      <button onclick="setFrontDirectView()">📐 真正面 (ねじ穴直視)</button>
    </div>
    <div class="status-badge" id="spec-badge">
      🟡 初期状態で分解表示ON：サブバッフル上の8箇所の真鍮鬼目ナットねじ穴が完全に見えます！
    </div>
  </div>

  <div id="legend">
    <div class="legend-item"><div class="color-dot" style="background:#d4af7a;"></div>外枠(天底側板)</div>
    <div class="legend-item"><div class="color-dot" style="background:#31343d;"></div>サブバッフル(黒受枠)</div>
    <div class="legend-item"><div class="color-dot" style="background:#eab308;"></div>★サブバッフルねじ穴(M4真鍮)</div>
    <div class="legend-item"><div class="color-dot" style="background:#2563eb;"></div>前面上段バッフル</div>
    <div class="legend-item"><div class="color-dot" style="background:#7c3aed;"></div>前面下段バッフル</div>
    <div class="legend-item"><div class="color-dot" style="background:#f97316;"></div>ポート管</div>
  </div>

  <script>
    const MODELS = {
      '3.2L': {
        W_OUT: 136, H_OUT: 230, D_OUT: 190, T: 12,
        W_IN: 112, H_IN: 206,
        RECESS: 4, T_SWAP: 12, T_FRAME: 12,
        H_UPPER: 136, H_LOWER: 70, Y_SPLIT: 82,
        Z_F_PLATE_START: 4, Z_F_FRAME_START: 16, Z_F_FRAME_END: 28,
        Z_R_FRAME_START: 162, Z_R_FRAME_END: 174, Z_R_PLATE_START: 174,
        WIN_W: 76, SCREW_X: 47,
        UPPER_WIN_TOP: 194, UPPER_WIN_BTM: 122,
        LOWER_WIN_TOP: 42,  LOWER_WIN_BTM: 36,
        SCREW_Y_COORDS: [206, 102, 62, 24]
      },
      '5.5L': {
        W_OUT: 136, H_OUT: 310, D_OUT: 210, T: 12,
        W_IN: 112, H_IN: 286,
        RECESS: 4, T_SWAP: 12, T_FRAME: 12,
        H_UPPER: 136, H_LOWER: 150, Y_SPLIT: 162,
        Z_F_PLATE_START: 4, Z_F_FRAME_START: 16, Z_F_FRAME_END: 28,
        Z_R_FRAME_START: 182, Z_R_FRAME_END: 194, Z_R_PLATE_START: 194,
        WIN_W: 76, SCREW_X: 47,
        UPPER_WIN_TOP: 274, UPPER_WIN_BTM: 202,
        LOWER_WIN_TOP: 122, LOWER_WIN_BTM: 36,
        SCREW_Y_COORDS: [286, 182, 142, 24]
      }
    };

    let curModelKey = '5.5L';
    let cfg = MODELS[curModelKey];

    let scene, camera, renderer, controls;
    let rootGroup, cabinetGroup;
    let frontInnerFrameGroup, rearInnerFrameGroup;
    let upperGroup, lowerGroup, rearUpperGroup, rearLowerGroup;
    let isCutaway = true, isWireframe = false, areBafflesVisible = true;

    init();
    animate();

    function init() {
      const container = document.getElementById('canvas-container');
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x111215);

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 3000);
      camera.position.set(-280, 240, -280);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.target.set(0, cfg.H_OUT/2, cfg.D_OUT/2);

      // Lights
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.80);
      scene.add(ambientLight);

      const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.95);
      dirLight1.position.set(-300, 450, -300);
      scene.add(dirLight1);

      const dirLight2 = new THREE.DirectionalLight(0x88aaff, 0.50);
      dirLight2.position.set(300, 200, 300);
      scene.add(dirLight2);

      // Floor Grid
      const grid = new THREE.GridHelper(700, 35, 0x3e4252, 0x222530);
      grid.position.y = -1;
      scene.add(grid);

      buildModel();

      window.addEventListener('resize', onWindowResize);
    }

    function switchEnclosureModel() {
      curModelKey = document.getElementById('model-select').value;
      cfg = MODELS[curModelKey];
      controls.target.set(0, cfg.H_OUT/2, cfg.D_OUT/2);
      buildModel();
    }

    function createMaterial(color, opacity=1.0, rough=0.35) {
      return new THREE.MeshStandardMaterial({
        color: color,
        roughness: rough,
        metalness: 0.15,
        transparent: opacity < 1.0,
        opacity: opacity,
        wireframe: isWireframe,
        side: THREE.DoubleSide
      });
    }

    function createLadderFrameGeometry() {
      const frameShape = new THREE.Shape();
      const wH = cfg.W_IN / 2;
      const hH = cfg.H_IN / 2;
      const frameCenterY = 12 + hH;

      frameShape.moveTo(-wH, -hH);
      frameShape.lineTo(wH, -hH);
      frameShape.lineTo(wH, hH);
      frameShape.lineTo(-wH, hH);
      frameShape.closePath();

      const winWHalf = cfg.WIN_W / 2;

      // Upper Window
      const uTopLocal = cfg.UPPER_WIN_TOP - frameCenterY;
      const uBtmLocal = cfg.UPPER_WIN_BTM - frameCenterY;
      const uHole = new THREE.Path();
      uHole.moveTo(-winWHalf, uBtmLocal);
      uHole.lineTo(winWHalf, uBtmLocal);
      uHole.lineTo(winWHalf, uTopLocal);
      uHole.lineTo(-winWHalf, uTopLocal);
      uHole.closePath();
      frameShape.holes.push(uHole);

      // Lower Window
      const lTopLocal = cfg.LOWER_WIN_TOP - frameCenterY;
      const lBtmLocal = cfg.LOWER_WIN_BTM - frameCenterY;
      const lHole = new THREE.Path();
      lHole.moveTo(-winWHalf, lBtmLocal);
      lHole.lineTo(winWHalf, lBtmLocal);
      lHole.lineTo(winWHalf, lTopLocal);
      lHole.lineTo(-winWHalf, lTopLocal);
      lHole.closePath();
      frameShape.holes.push(lHole);

      // DRILL 8x CIRCULAR SCREW HOLES DIRECTLY INTO THE WOODEN SUB-BAFFLE!
      const sx = cfg.SCREW_X;
      cfg.SCREW_Y_COORDS.forEach(gy => {
        const localY = gy - frameCenterY;
        const holeL = new THREE.Path();
        holeL.absarc(-sx, localY, 3.5, 0, Math.PI * 2, true);
        frameShape.holes.push(holeL);
        const holeR = new THREE.Path();
        holeR.absarc(sx, localY, 3.5, 0, Math.PI * 2, true);
        frameShape.holes.push(holeR);
      });

      return new THREE.ExtrudeGeometry(frameShape, { depth: cfg.T_FRAME, bevelEnabled: false });
    }

    // High-visibility Brass Insert Nut Mesh with distinct golden collar and dark inner socket
    function createBrassNutMesh() {
      const nutGroup = new THREE.Group();
      
      // Brass collar outer flange (OD 9mm, bright shiny gold)
      const flangeGeo = new THREE.CylinderGeometry(4.5, 4.5, 0.8, 24);
      const matBrass = new THREE.MeshStandardMaterial({ color: 0xfacc15, roughness: 0.15, metalness: 0.95 });
      const flange = new THREE.Mesh(flangeGeo, matBrass);
      flange.rotation.x = Math.PI / 2;
      nutGroup.add(flange);

      // Threaded inner cylinder (ID 4.5mm, dark cavity depth)
      const socketGeo = new THREE.CylinderGeometry(2.2, 2.2, 9.0, 24, 1, true);
      const matSocket = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.8, metalness: 0.5 });
      const socket = new THREE.Mesh(socketGeo, matSocket);
      socket.rotation.x = Math.PI / 2;
      socket.position.z = 4.5;
      nutGroup.add(socket);

      // Bottom end stop
      const bottomGeo = new THREE.CircleGeometry(2.2, 24);
      const matBottom = new THREE.MeshBasicMaterial({ color: 0x000000 });
      const bottom = new THREE.Mesh(bottomGeo, matBottom);
      bottom.position.z = 9.0;
      nutGroup.add(bottom);

      return nutGroup;
    }

    function buildModel() {
      if (rootGroup) scene.remove(rootGroup);
      rootGroup = new THREE.Group();

      const matWood = createMaterial(0xd4af7a);
      const matFrame = createMaterial(0x282a30); // Sub-baffle dark graphite wood
      const matUpper = createMaterial(0x2563eb, areBafflesVisible ? 1.0 : 0.0);
      const matLower = createMaterial(0x7c3aed, areBafflesVisible ? 1.0 : 0.0);
      const matRearUpper = createMaterial(0x475569, areBafflesVisible ? 1.0 : 0.0);
      const matRearLower = createMaterial(0x64748b, areBafflesVisible ? 1.0 : 0.0);
      const matPort = createMaterial(0xf97316);
      const matPartition = createMaterial(0x9a7b56);
      const matScrew = createMaterial(0xffffff, areBafflesVisible ? 1.0 : 0.0, 0.05);

      cabinetGroup = new THREE.Group();

      // 1. Top & Bottom Panels
      const topGeo = new THREE.BoxGeometry(cfg.W_OUT, cfg.T, cfg.D_OUT);
      const topMesh = new THREE.Mesh(topGeo, matWood);
      topMesh.position.set(0, cfg.H_OUT - cfg.T/2, cfg.D_OUT/2);
      cabinetGroup.add(topMesh);

      const btmGeo = new THREE.BoxGeometry(cfg.W_OUT, cfg.T, cfg.D_OUT);
      const btmMesh = new THREE.Mesh(btmGeo, matWood);
      btmMesh.position.set(0, cfg.T/2, cfg.D_OUT/2);
      cabinetGroup.add(btmMesh);

      // 2. Left Side Panel
      const leftGeo = new THREE.BoxGeometry(cfg.T, cfg.H_IN, cfg.D_OUT);
      const leftMesh = new THREE.Mesh(leftGeo, matWood);
      leftMesh.position.set(cfg.W_OUT/2 - cfg.T/2, 12 + cfg.H_IN/2, cfg.D_OUT/2);
      cabinetGroup.add(leftMesh);

      // 3. Right Side Panel
      if (!isCutaway) {
        const rightGeo = new THREE.BoxGeometry(cfg.T, cfg.H_IN, cfg.D_OUT);
        const rightMesh = new THREE.Mesh(rightGeo, matWood);
        rightMesh.position.set(-cfg.W_OUT/2 + cfg.T/2, 12 + cfg.H_IN/2, cfg.D_OUT/2);
        cabinetGroup.add(rightMesh);
      }

      // 4. FRONT "日" SUB-BAFFLE FRAME (8x Real Threaded Holes + High-Visibility Brass Nuts)
      frontInnerFrameGroup = new THREE.Group();
      frontInnerFrameGroup.position.set(0, 12 + cfg.H_IN/2, cfg.Z_F_FRAME_START);
      
      const ladderFrameGeo = createLadderFrameGeometry();
      const frontFrameMesh = new THREE.Mesh(ladderFrameGeo, matFrame);
      frontInnerFrameGroup.add(frontFrameMesh);

      // Add 8x Brass Insert Nuts into the front frame holes
      const frameCenterY = 12 + cfg.H_IN / 2;
      const sx = cfg.SCREW_X;
      cfg.SCREW_Y_COORDS.forEach(gy => {
        const localY = gy - frameCenterY;
        const nutL = createBrassNutMesh();
        nutL.position.set(-sx, localY, 0.2);
        frontInnerFrameGroup.add(nutL);
        const nutR = createBrassNutMesh();
        nutR.position.set(sx, localY, 0.2);
        frontInnerFrameGroup.add(nutR);
      });
      cabinetGroup.add(frontInnerFrameGroup);

      // 5. REAR "日" SUB-BAFFLE FRAME (8x Real Threaded Holes + Brass Nuts on rear face)
      rearInnerFrameGroup = new THREE.Group();
      rearInnerFrameGroup.position.set(0, 12 + cfg.H_IN/2, cfg.Z_R_FRAME_START);

      const rearFrameMesh = new THREE.Mesh(ladderFrameGeo, matFrame);
      rearInnerFrameGroup.add(rearFrameMesh);

      cfg.SCREW_Y_COORDS.forEach(gy => {
        const localY = gy - frameCenterY;
        const nutL = createBrassNutMesh();
        nutL.rotation.y = Math.PI;
        nutL.position.set(-sx, localY, 12.0 - 0.2);
        rearInnerFrameGroup.add(nutL);
        const nutR = createBrassNutMesh();
        nutR.rotation.y = Math.PI;
        nutR.position.set(sx, localY, 12.0 - 0.2);
        rearInnerFrameGroup.add(nutR);
      });
      cabinetGroup.add(rearInnerFrameGroup);

      // 6. INTERNAL SOLID DBR PARTITION BRACE
      const braceDepth = cfg.Z_R_FRAME_START - cfg.Z_F_FRAME_END;
      const braceCenterZ = cfg.Z_F_FRAME_END + braceDepth / 2;

      if (curModelKey === '5.5L') {
        const dbrSolidGeo = new THREE.BoxGeometry(cfg.W_IN, cfg.T, braceDepth);
        const dbrMesh = new THREE.Mesh(dbrSolidGeo, matPartition);
        dbrMesh.position.set(0, cfg.Y_SPLIT, braceCenterZ);
        cabinetGroup.add(dbrMesh);

        // 1st Internal Port Pipe
        const p1Geo = new THREE.CylinderGeometry(18, 18, 80, 24, 1, true);
        const p1Mesh = new THREE.Mesh(p1Geo, matPort);
        p1Mesh.position.set(0, cfg.Y_SPLIT - 25, braceCenterZ);
        cabinetGroup.add(p1Mesh);
      } else {
        const braceGroup = new THREE.Group();
        const rim = 24;
        const fBar = new THREE.Mesh(new THREE.BoxGeometry(cfg.W_IN, cfg.T, rim), matPartition);
        fBar.position.set(0, cfg.Y_SPLIT, cfg.Z_F_FRAME_END + rim/2);
        braceGroup.add(fBar);
        const rBar = new THREE.Mesh(new THREE.BoxGeometry(cfg.W_IN, cfg.T, rim), matPartition);
        rBar.position.set(0, cfg.Y_SPLIT, cfg.Z_R_FRAME_START - rim/2);
        braceGroup.add(rBar);
        const lBar = new THREE.Mesh(new THREE.BoxGeometry(rim, cfg.T, braceDepth - 2*rim), matPartition);
        lBar.position.set(-cfg.W_IN/2 + rim/2, cfg.Y_SPLIT, braceCenterZ);
        braceGroup.add(lBar);
        const rtBar = new THREE.Mesh(new THREE.BoxGeometry(rim, cfg.T, braceDepth - 2*rim), matPartition);
        rtBar.position.set(cfg.W_IN/2 - rim/2, cfg.Y_SPLIT, braceCenterZ);
        braceGroup.add(rtBar);
        cabinetGroup.add(braceGroup);
      }

      rootGroup.add(cabinetGroup);

      // ==========================================
      // FRONT SWAPPABLE SPLIT BAFFLES
      // ==========================================
      const pW = cfg.W_IN / 2;
      const pH_u = cfg.H_UPPER / 2;
      const pH_l = cfg.H_LOWER / 2;
      const yUpperCenter = cfg.Y_SPLIT + pH_u;
      const yLowerCenter = 12 + pH_l;

      // Front Upper Driver Baffle
      upperGroup = new THREE.Group();
      upperGroup.position.set(0, yUpperCenter, cfg.Z_F_PLATE_START);

      const upperType = document.getElementById('upper-select').value;
      let uCutoutR = 38;
      if (upperType === 'u1') uCutoutR = 28;
      if (upperType === 'u3') uCutoutR = 48;
      if (upperType === 'u4') uCutoutR = 0;

      const uPlateShape = new THREE.Shape();
      uPlateShape.moveTo(-pW, -pH_u);
      uPlateShape.lineTo(pW, -pH_u);
      uPlateShape.lineTo(pW, pH_u);
      uPlateShape.lineTo(-pW, pH_u);
      uPlateShape.closePath();

      if (uCutoutR > 0) {
        const uDriverHole = new THREE.Path();
        uDriverHole.absarc(0, 5, uCutoutR, 0, Math.PI * 2, true);
        uPlateShape.holes.push(uDriverHole);
      }

      const uPlateGeo = new THREE.ExtrudeGeometry(uPlateShape, { depth: cfg.T_SWAP, bevelEnabled: false });
      const uPlateMesh = new THREE.Mesh(uPlateGeo, matUpper);
      upperGroup.add(uPlateMesh);

      if (uCutoutR > 0 && areBafflesVisible) {
        const coneGeo = new THREE.CylinderGeometry(uCutoutR * 0.9, uCutoutR * 0.3, 18, 32, 1, true);
        const coneMesh = new THREE.Mesh(coneGeo, createMaterial(0x222222));
        coneMesh.rotation.x = -Math.PI / 2;
        coneMesh.position.set(0, 5, 14);
        upperGroup.add(coneMesh);

        const capGeo = new THREE.SphereGeometry(uCutoutR * 0.25, 16, 16);
        const capMesh = new THREE.Mesh(capGeo, createMaterial(0xdd8800));
        capMesh.position.set(0, 5, 4);
        upperGroup.add(capMesh);
      }

      if (areBafflesVisible) {
        const uScrewY1 = cfg.SCREW_Y_COORDS[0] - yUpperCenter;
        const uScrewY2 = cfg.SCREW_Y_COORDS[1] - yUpperCenter;
        [[-sx, uScrewY1], [sx, uScrewY1], [-sx, uScrewY2], [sx, uScrewY2]].forEach(pos => {
          const screw = new THREE.Mesh(new THREE.CylinderGeometry(3.5, 3.5, 1.5, 16), matScrew);
          screw.rotation.x = Math.PI / 2;
          screw.position.set(pos[0], pos[1], 0.2);
          upperGroup.add(screw);
        });
      }
      rootGroup.add(upperGroup);

      // Front Lower Acoustic Baffle
      lowerGroup = new THREE.Group();
      lowerGroup.position.set(0, yLowerCenter, cfg.Z_F_PLATE_START);

      const lowerType = document.getElementById('lower-select').value;
      const lPlateShape = new THREE.Shape();
      lPlateShape.moveTo(-pW, -pH_l);
      lPlateShape.lineTo(pW, -pH_l);
      lPlateShape.lineTo(pW, pH_l);
      lPlateShape.lineTo(-pW, pH_l);
      lPlateShape.closePath();

      let portR = 0;
      if (lowerType === 'p2') portR = (curModelKey === '5.5L') ? 22.5 : 16;
      if (lowerType === 'p4') portR = 36;

      if (portR > 0) {
        const lPortHole = new THREE.Path();
        lPortHole.absarc(0, 0, portR, 0, Math.PI * 2, true);
        lPlateShape.holes.push(lPortHole);
      }

      const lPlateGeo = new THREE.ExtrudeGeometry(lPlateShape, { depth: cfg.T_SWAP, bevelEnabled: false });
      const lPlateMesh = new THREE.Mesh(lPlateGeo, matLower);
      lowerGroup.add(lPlateMesh);

      const portLen = (curModelKey === '5.5L') ? 130 : 120;
      if (areBafflesVisible) {
        if (lowerType === 'p2') {
          const tubeGeo = new THREE.CylinderGeometry(portR + 1.5, portR + 1.5, portLen, 32, 1, true);
          const tubeMesh = new THREE.Mesh(tubeGeo, matPort);
          tubeMesh.rotation.x = Math.PI / 2;
          tubeMesh.position.set(0, 0, portLen / 2 + 12);
          lowerGroup.add(tubeMesh);
        } else if (lowerType === 'p3') {
          const slitGeo = new THREE.BoxGeometry(cfg.WIN_W, (curModelKey === '5.5L') ? 18 : 12, portLen);
          const slitMesh = new THREE.Mesh(slitGeo, matPort);
          slitMesh.position.set(0, 0, portLen / 2 + 12);
          lowerGroup.add(slitMesh);
        } else if (lowerType === 'p4') {
          const prConeGeo = new THREE.CylinderGeometry(32, 10, 12, 32, 1, true);
          const prMesh = new THREE.Mesh(prConeGeo, createMaterial(0x444444));
          prMesh.rotation.x = -Math.PI / 2;
          prMesh.position.set(0, 0, 10);
          lowerGroup.add(prMesh);
        }

        const lScrewY1 = cfg.SCREW_Y_COORDS[2] - yLowerCenter;
        const lScrewY2 = cfg.SCREW_Y_COORDS[3] - yLowerCenter;
        [[-sx, lScrewY1], [sx, lScrewY1], [-sx, lScrewY2], [sx, lScrewY2]].forEach(pos => {
          const screw = new THREE.Mesh(new THREE.CylinderGeometry(3.5, 3.5, 1.5, 16), matScrew);
          screw.rotation.x = Math.PI / 2;
          screw.position.set(pos[0], pos[1], 0.2);
          lowerGroup.add(screw);
        });
      }
      rootGroup.add(lowerGroup);

      // ==========================================
      // REAR SWAPPABLE SPLIT SOLID BAFFLES
      // ==========================================
      rearUpperGroup = new THREE.Group();
      rearUpperGroup.position.set(0, yUpperCenter, cfg.Z_R_PLATE_START);

      const rUpperShape = new THREE.Shape();
      rUpperShape.moveTo(-pW, -pH_u);
      rUpperShape.lineTo(pW, -pH_u);
      rUpperShape.lineTo(pW, pH_u);
      rUpperShape.lineTo(-pW, pH_u);
      rUpperShape.closePath();

      const rUpperGeo = new THREE.ExtrudeGeometry(rUpperShape, { depth: cfg.T_SWAP, bevelEnabled: false });
      const rUpperMesh = new THREE.Mesh(rUpperGeo, matRearUpper);
      rearUpperGroup.add(rUpperMesh);

      if (areBafflesVisible) {
        const uScrewY1 = cfg.SCREW_Y_COORDS[0] - yUpperCenter;
        const uScrewY2 = cfg.SCREW_Y_COORDS[1] - yUpperCenter;
        [[-sx, uScrewY1], [sx, uScrewY1], [-sx, uScrewY2], [sx, uScrewY2]].forEach(pos => {
          const screw = new THREE.Mesh(new THREE.CylinderGeometry(3.5, 3.5, 1.5, 16), matScrew);
          screw.rotation.x = Math.PI / 2;
          screw.position.set(pos[0], pos[1], 12.2);
          rearUpperGroup.add(screw);
        });
      }
      rootGroup.add(rearUpperGroup);

      rearLowerGroup = new THREE.Group();
      rearLowerGroup.position.set(0, yLowerCenter, cfg.Z_R_PLATE_START);

      const rLowerShape = new THREE.Shape();
      rLowerShape.moveTo(-pW, -pH_l);
      rLowerShape.lineTo(pW, -pH_l);
      rLowerShape.lineTo(pW, pH_l);
      rLowerShape.lineTo(-pW, pH_l);
      rLowerShape.closePath();

      const rLowerGeo = new THREE.ExtrudeGeometry(rLowerShape, { depth: cfg.T_SWAP, bevelEnabled: false });
      const rLowerMesh = new THREE.Mesh(rLowerGeo, matRearLower);
      rearLowerGroup.add(rLowerMesh);

      if (areBafflesVisible) {
        const lScrewY1 = cfg.SCREW_Y_COORDS[2] - yLowerCenter;
        const lScrewY2 = cfg.SCREW_Y_COORDS[3] - yLowerCenter;
        [[-sx, lScrewY1], [sx, lScrewY1], [-sx, lScrewY2], [sx, lScrewY2]].forEach(pos => {
          const screw = new THREE.Mesh(new THREE.CylinderGeometry(3.5, 3.5, 1.5, 16), matScrew);
          screw.rotation.x = Math.PI / 2;
          screw.position.set(pos[0], pos[1], 12.2);
          rearLowerGroup.add(screw);
        });
      }
      rootGroup.add(rearLowerGroup);

      scene.add(rootGroup);

      // Default Explode View at 45 to directly expose sub-baffle screw holes on load!
      updateExplode(document.getElementById('explode-slider').value);
    }

    function toggleBaffles() {
      areBafflesVisible = !areBafflesVisible;
      const btn = document.getElementById('toggle-baffles-btn');
      if (areBafflesVisible) {
        btn.innerHTML = "👁️ 前面・背面バッフル表示: ON (クリックで非表示)";
        btn.style.background = "#3b82f6";
      } else {
        btn.innerHTML = "🔍 サブバッフルねじ穴 直視モード: (バッフル非表示中)";
        btn.style.background = "#eab308";
        btn.style.color = "#111";
      }
      buildModel();
    }

    function updateModel() {
      buildModel();
    }

    function updateExplode(val) {
      const dist = parseFloat(val);
      if (upperGroup) upperGroup.position.z = cfg.Z_F_PLATE_START - dist * 1.0;
      if (lowerGroup) lowerGroup.position.z = cfg.Z_F_PLATE_START - dist * 1.0;
      if (rearUpperGroup) rearUpperGroup.position.z = cfg.Z_R_PLATE_START + dist * 1.0;
      if (rearLowerGroup) rearLowerGroup.position.z = cfg.Z_R_PLATE_START + dist * 1.0;
      if (frontInnerFrameGroup) frontInnerFrameGroup.position.z = cfg.Z_F_FRAME_START - dist * 0.15;
      if (rearInnerFrameGroup) rearInnerFrameGroup.position.z = cfg.Z_R_FRAME_START + dist * 0.15;
    }

    function toggleCutaway() {
      isCutaway = !isCutaway;
      const btn = document.getElementById('cutaway-btn');
      if (isCutaway) {
        btn.innerHTML = "✂️ 右側板 断面表示: ON";
        btn.style.background = "#10b981";
      } else {
        btn.innerHTML = "✂️ 右側板 断面表示: OFF";
        btn.style.background = "#3b82f6";
      }
      buildModel();
    }

    function toggleWireframe() {
      isWireframe = !isWireframe;
      buildModel();
    }

    function resetCamera() {
      camera.position.set(0, cfg.H_OUT/2, -420);
      controls.target.set(0, cfg.H_OUT/2, cfg.D_OUT/2);
    }

    function setFrontRightView() {
      camera.position.set(-280, 240, -280);
      controls.target.set(0, cfg.H_OUT/2, cfg.D_OUT/2);
    }

    function setFrontDirectView() {
      camera.position.set(0, cfg.H_OUT/2, -380);
      controls.target.set(0, cfg.H_OUT/2, cfg.D_OUT/2);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
